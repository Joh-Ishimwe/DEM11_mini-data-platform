# ---------------------------------------------------------------------------
# Mini Data Platform - local stack
#
# Services: postgres, minio, minio-init, airflow-init, airflow-webserver,
#           airflow-scheduler, metabase
#
# Read this file top to bottom before running it. You should be able to
# explain every line of it from memory.
# ---------------------------------------------------------------------------

x-airflow-common: &airflow-common
  # YAML anchor: defines a block once, reused by every Airflow service below
  # with `<<: *airflow-common`. Avoids copy-pasting the same 20 lines.
  #
  # Built from docker/airflow/Dockerfile, which bakes requirements.txt into
  # the image instead of reinstalling it on every container start. `image:`
  # gives the build a name so it can also be tagged and pushed to a registry
  # (see .github/workflows/main.yml) instead of only existing locally.
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE:-mini-data-platform-airflow:local}
  environment:
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-false}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # Defaults (4 webserver workers, 2 DAG-parsing processes) are tuned for a
    # real server. On a small box - or a 2-CPU/7GB CI runner also running
    # Postgres, MinIO and Metabase at the same time - that's enough to starve
    # everything of memory and CPU, which shows up as containers stuck
    # "starting" forever rather than a clean error. This platform's scale
    # (a few files a day) doesn't need the defaults either way.
    AIRFLOW__WEBSERVER__WORKERS: '2'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    # Makes `from src.transformations import cleaning` work inside the container.
    PYTHONPATH: /opt/airflow
    # Pipeline config, read by src/utils/constants.py
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    ANALYTICS_DB: ${ANALYTICS_DB}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}
    MINIO_ARCHIVE_BUCKET: ${MINIO_ARCHIVE_BUCKET}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    # Bind mounts: your laptop's files appear inside the container, live.
    # Edit a DAG locally and Airflow picks it up without a rebuild.
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # -------------------------------------------------------------------------
  # STORAGE: relational warehouse + Airflow metadata + Metabase app DB
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mdp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The `postgres` maintenance DB; init.sql creates the three real ones.
      POSTGRES_DB: postgres
      ANALYTICS_DB: ${ANALYTICS_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
      METABASE_DB: ${METABASE_DB}
      METABASE_READONLY_USER: ${METABASE_READONLY_USER}
      METABASE_READONLY_PASSWORD: ${METABASE_READONLY_PASSWORD}
    volumes:
      # Named volume: survives `docker compose down`. Without this your
      # warehouse is wiped on every restart.
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run ONLY on a fresh volume. Editing init.sql does nothing
      # until you run `docker compose down -v`. This confuses everyone once.
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # The one source of schema truth, shared with the CI job. See init.sql.
      - ./migrations:/migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      # `depends_on` alone only waits for the container to START. A healthcheck
      # is how you wait for it to be USABLE. Skipping this causes the classic
      # "connection refused on first run, fine on second run" bug.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # LANDING ZONE: S3-compatible object storage
  # -------------------------------------------------------------------------
  minio:
    # MinIO Inc. stopped publishing to Docker Hub; quay.io is the current
    # official registry (docker.io/minio/minio is gone as of this writing).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mdp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # One-shot container: creates buckets then exits. This is what makes a
    # fresh clone work with zero manual clicking in a web console.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mdp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_RAW_BUCKET} &&
      mc mb --ignore-existing local/${MINIO_ARCHIVE_BUCKET} &&
      echo 'buckets ready' "
    restart: "no"

  # -------------------------------------------------------------------------
  # ORCHESTRATION
  # -------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: mdp-airflow-init
    # One physical line, deliberately. An earlier version wrapped this across
    # several indented lines relying on YAML/shell line-continuation to join
    # them back together - which looked right in isolated testing but still
    # broke inside the real container (argparse reported every flag as
    # missing despite them being present in the joined string). Not worth
    # chasing further: a single line has no folding or continuation behaviour
    # to get subtly wrong in the first place.
    # yamllint disable rule:line-length
    entrypoint: >
      /bin/bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Data --lastname Engineer --role Admin --email admin@example.com || true"
    # yamllint enable rule:line-length
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: mdp-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: mdp-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # VISUALISATION
  # -------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.50.21
    container_name: mdp-metabase
    environment:
      # Metabase stores its own dashboards in its own application database.
      # Point it at Postgres, NOT the default in-memory H2, or every dashboard
      # you build disappears on restart.
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

# No custom network block is needed: Compose creates a default bridge network
# and every service can reach every other by its SERVICE NAME as hostname.
# That is why the code says `postgres:5432`, never `localhost:5432`.
