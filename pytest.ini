[pytest]
# Makes `from src...` importable without installing the package.
pythonpath = .

testpaths = tests
addopts = -v --strict-markers

# Registering markers means a typo in a marker name FAILS instead of being
# silently ignored. That is what --strict-markers buys you.
markers =
    unit: fast, no network, no database, no docker
    integration: needs a real Postgres and/or MinIO
    data_quality: runs expectations against sample files
    e2e: needs the full docker-compose stack running
